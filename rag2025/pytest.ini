[pytest]
# Without this file pytest recurses the whole tree from the rootdir, including
# ``backup_mail_package_2026/python_project/rag2025`` -- a full, stale COPY of
# this project. That copy holds its own ``test_qdrant.py`` (module-level
# ``QdrantClient(...)`` against a dead host), which aborts collection for the
# ENTIRE suite with an INTERNALERROR and masks every real test.
#
# Scoping collection to the real test tree keeps the backup copy out of the
# run without deleting anyone's files.
norecursedirs =
    backup_mail_package_2026
    .venv
    venv
    .git
    __pycache__
    node_modules
    .pytest_cache
    .mypy_cache
    .ruff_cache
    .claude
    graphify-out
    results
    data
    models
    logs
