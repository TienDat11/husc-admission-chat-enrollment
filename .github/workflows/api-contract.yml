name: API Contract

on:
  pull_request:
    paths:
      - 'rag2025/src/**'
      - 'rag2025/scripts/export_openapi.py'
      - 'uni-guide-ai/src/lib/api-types.ts'
      - 'uni-guide-ai/src/lib/adminApi.ts'
      - 'uni-guide-ai/src/lib/api.ts'
      - 'uni-guide-ai/tests/contract/**'
      - 'uni-guide-ai/tests-smoke/**'
      - 'uni-guide-ai/scripts/**'
      - 'api/openapi.json'
      - '.github/workflows/api-contract.yml'

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: uni-guide-ai/package-lock.json

      - run: pip install -r rag2025/requirements.txt
        if: hashFiles('rag2025/requirements.txt') != ''

      - run: cd uni-guide-ai && npm ci

      # Runs against the committed api/openapi.json, before the export step
      # overwrites it — this is the gate that a backend field/enum change
      # left un-regenerated trips on.
      - name: Contract tests (read committed schema)
        run: cd uni-guide-ai && npx vitest run tests/contract

      - name: Export OpenAPI schema
        run: python rag2025/scripts/export_openapi.py
        env:
          PYTHONPATH: rag2025/src

      - name: Generate FE types
        run: cd uni-guide-ai && npm run types:gen

      - name: Check no drift
        run: |
          git diff --exit-code api/openapi.json uni-guide-ai/src/lib/api-types.ts
        # Failure indicates BE/FE schema drift — regen locally and commit.

      # Needs the Python backend, so it is its own step, never folded into
      # `npm test`. The orchestrator exits non-zero with a printed reason
      # when the server cannot start — a broken backend can never skip green.
      - name: Cross-stack CRUD smoke (real client vs real server)
        run: cd uni-guide-ai && npm run test:smoke
