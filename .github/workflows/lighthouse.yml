name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'uni-guide-ai/**'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: uni-guide-ai/package-lock.json
      - run: cd uni-guide-ai && npm ci
      - run: cd uni-guide-ai && npm run build
      - run: cd uni-guide-ai && npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
